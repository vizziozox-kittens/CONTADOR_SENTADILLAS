<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estado del detector | SquatBeast</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent}
body{display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
</style>
<link rel="stylesheet" href="/temas.css">
</head>

<body>
<script>
(function(){var v=["floral","halloween","christmas","birthday","cyber","space","ocean","arcade","beast","storm","aura","slime","kawaii","ninja","mecha"];var d=(new URLSearchParams(location.search).get("design")||"").toLowerCase();if(v.indexOf(d)>-1){document.body.classList.add("tema-"+d);}})();
</script>
    <div class="panel" id="panel" data-state="idle"><span class="dot"></span>
        <div class="content">
            <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Estado del detector</div>
            <div class="status" id="status">Conectando...</div>
            <div class="sub" id="sub">Esperando información de la fuente principal de OBS</div>
        </div>
    </div>
    <script>
        (async () => {
            const params = new URLSearchParams(location.search); let sessionId = params.get('session') || localStorage.getItem('squat_session_id') || '';
            const status = document.getElementById('status'), sub = document.getElementById('sub'), panel = document.getElementById('panel');
            try { const endpoint = sessionId ? `/api/session?session=${encodeURIComponent(sessionId)}` : '/api/session'; const r = await fetch(endpoint, { cache: 'no-store' }); const d = await r.json(); if (!r.ok || !d.ok || !d.sessionId) throw Error('No se pudo obtener la sesión'); sessionId = d.sessionId; localStorage.setItem('squat_session_id', sessionId); } catch (e) { status.textContent = 'No se pudo conectar'; sub.textContent = 'Comprueba que la URL incluya ?session=...'; panel.dataset.state = 'error'; return; }
            function paint(data) { const text = String(data?.text || 'Esperando al detector'); status.textContent = text; const t = text.toLowerCase(); panel.dataset.state = /calibrando|esperando|conectando/.test(t) ? 'work' : /no se detecta|no visible|error|detenido|desconectado/.test(t) ? 'error' : /pausad/.test(t) ? 'idle' : 'active'; sub.textContent = 'Estado en tiempo real'; }
            function connect() { const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; const ws = new WebSocket(`${protocol}//${location.host}/ws?session=${encodeURIComponent(sessionId)}`); ws.addEventListener('open', () => { sub.textContent = 'Conectado · estado en tiempo real'; }); ws.addEventListener('message', e => { try { const m = JSON.parse(e.data); if (m.type === 'detector:status:update') paint(m.data); } catch (_) { } }); ws.addEventListener('close', () => { sub.textContent = 'Reconectando con el detector...'; setTimeout(connect, 2000); }); ws.addEventListener('error', () => ws.close()); }
            connect();
        })();
    </script>
</body>

</html>
