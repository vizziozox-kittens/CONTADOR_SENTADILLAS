<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contador de Sentadillas</title>
<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Georgia, "Times New Roman", serif;
    }

    #app {
        position: relative;
        width: 100%;
        height: 100%;
    }

    /* El lienzo ocupa todo el tamaño configurado en la fuente de navegador de OBS. */
    #counterBox {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        padding: 0;
        text-align: center;
        z-index: 20;
    }

    /*
          IMAGEN DE DISEÑO TEMPORAL:
          Reemplaza public/contador-diseno.png por tu propia imagen.
          Mantén el mismo nombre para no tener que cambiar el código.
          La imagen debe tener el marco y las decoraciones, pero deja libre
          el centro para que el número real se dibuje encima.
        */
    #counterContent {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 1870 / 550;
        background-image: url('./contador-diseno.png');
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #302333;
        overflow: hidden;
    }

    /* Título centrado en la parte superior de la imagen */
    #counterLabel {
        position: absolute;
        top: 38%;/* Posición vertical, numero menor sube */
        left: 51%;/* Centrado horizontal */
        transform: translateX(-50%);
        width: 60%;
        margin: 0;
        text-align: center;
        font-size: clamp(18px, 3.5vw, 45px);/* Tamaño */
        line-height: 1.1;
        font-weight: 500;
        letter-spacing: .14em;/* Separación entre letras */
        color: #59405d;
        white-space: nowrap;
    }

    /* Número centrado en el espacio central de la imagen */
    #counter {
        position: absolute;
        top: 42%; /* Posición vertical */
        left: 50%; /* Centrado horizontal */
        transform: translateX(-50%);
        width: 60%;
        margin: 0;
        text-align: center;
        font-size: clamp(40px, 15vw, 170px);/* Tamaño */
        line-height: 1;
        font-weight: 500;
        color: #302333;
        text-shadow: 0 1px 2px rgba(255, 255, 255, .75);
        white-space: nowrap;
    }

    /* Texto centrado en la parte inferior de la imagen */
    #counterSub {
        position: absolute;
        top: 59.5%;/* Posición vertical */
        left: 50%;/* Centrado horizontal */
        transform: translateX(-50%);
        width: 60%;
        margin: 0;
        text-align: center;
        font-size: clamp(12px, 2vw, 35px);/* Tamaño */
        line-height: 1.1;
        font-weight: 500;
        letter-spacing: .10em;
        color: #59405d;
        white-space: nowrap;
    }

    .counterPulse {
        animation: counterPulse .35s ease;
    }

    @keyframes counterPulse {
        0% {
            filter: brightness(1);
        }

        50% {
            filter: brightness(1.18);
        }

        100% {
            filter: brightness(1);
        }
    }
</style>

</head>


<body>


    <div id="app">


        <div id="counterBox">
            <div id="counterContent" aria-label="Contador de sentadillas">
                <div id="counterLabel">SENTADILLAS</div>
                <div id="counter">0</div>
                <div id="counterSub">PENDIENTES</div>
            </div>
        </div>


    </div>


    <script>
        /* SESI\u{D3}N ESTABLE PARA P\u{C1}GINAS DE OBS */
        (function () {
            const params = new URLSearchParams(window.location.search);
            let sessionId = params.get("session") || localStorage.getItem("squat_session_id") || "";
            window.SQUAT_SESSION_ID = sessionId;
            const nativeFetch = window.fetch.bind(window);
            function addSession(url) {
                const absolute = new URL(url, window.location.origin);
                if (absolute.origin !== window.location.origin) return url;
                if (absolute.pathname.startsWith("/api/") && window.SQUAT_SESSION_ID) absolute.searchParams.set("session", window.SQUAT_SESSION_ID);
                return absolute.pathname + absolute.search + absolute.hash;
            }
            window.SQUAT_SESSION_READY = (async () => {
                const endpoint = sessionId ? `/api/session?session=${encodeURIComponent(sessionId)}` : "/api/session";
                const response = await nativeFetch(endpoint, { credentials: "same-origin" });
                const data = await response.json();
                if (!response.ok || !data.ok || !data.sessionId) throw new Error("No se pudo recuperar la sesi\u{F3}n.");
                window.SQUAT_SESSION_ID = data.sessionId;
                localStorage.setItem("squat_session_id", data.sessionId);
                return data;
            })();
            window.fetch = async function (input, init) {
                await window.SQUAT_SESSION_READY;
                if (typeof input === "string") input = addSession(input);
                else if (input instanceof Request) input = new Request(addSession(input.url), input);
                return nativeFetch(input, init);
            };
        })();
    </script>

    <script>

        /* ============================================================
           ELEMENTOS
        ============================================================ */

        const counterElement =
            document.getElementById("counter");

        const counterBox =
            document.getElementById("counterBox");


        /* ============================================================
           VARIABLES
        ============================================================ */

        let counter = 0;

        let socket = null;


        /* ============================================================
           ACTUALIZAR CONTADOR
        ============================================================ */

        function updateCounter(value) {

            const newValue =
                Math.max(
                    0,
                    Math.floor(
                        Number(value) || 0
                    )
                );


            if (newValue !== counter) {

                counter = newValue;

                counterElement.textContent =
                    counter;


                counterBox.classList.remove(
                    "counterPulse"
                );


                void counterBox.offsetWidth;


                counterBox.classList.add(
                    "counterPulse"
                );

            } else {

                counterElement.textContent =
                    counter;

            }

        }


        /* ============================================================
           CARGAR CONTADOR
        ============================================================ */

        async function loadCounter() {

            try {

                const response =
                    await fetch(
                        "/api/squats",
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "No se pudo obtener el contador"
                    );

                }


                const data =
                    await response.json();


                updateCounter(
                    data.pendingSquats
                );

            } catch (error) {

                console.error(
                    "Error cargando contador:",
                    error
                );

            }

        }


        /* ============================================================
           WEBSOCKET
        ============================================================ */

        function connectWebSocket() {

            if (
                socket &&
                (
                    socket.readyState ===
                    WebSocket.OPEN ||

                    socket.readyState ===
                    WebSocket.CONNECTING
                )
            ) {

                return;

            }


            const protocol =
                location.protocol === "https:"
                    ? "wss:"
                    : "ws:";


            socket =
                new WebSocket(
                    `${protocol}//${location.host}/ws?session=${encodeURIComponent(window.SQUAT_SESSION_ID || "")}`
                );


            socket.addEventListener(
                "open",
                () => {

                    console.log(
                        "\u{1F7E2} Contador conectado"
                    );

                }
            );


            socket.addEventListener(
                "message",
                event => {

                    try {

                        const message =
                            JSON.parse(
                                event.data
                            );


                        if (
                            message.type ===
                            "counter:update"
                        ) {

                            updateCounter(
                                message.data
                                    ?.pendingSquats
                            );

                        }

                    } catch (error) {

                        console.error(
                            "Error leyendo WebSocket:",
                            error
                        );

                    }

                }
            );


            socket.addEventListener(
                "close",
                () => {

                    console.log(
                        "\u{1F534} WebSocket desconectado"
                    );


                    setTimeout(
                        connectWebSocket,
                        2000
                    );

                }
            );


            socket.addEventListener(
                "error",
                error => {

                    console.error(
                        "Error WebSocket:",
                        error
                    );

                }
            );

        }


        /* ============================================================
           INICIO
        ============================================================ */

        loadCounter();

        connectWebSocket();


    </script>

</body>

</html>
