<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Sentadillas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Baloo+2:wght@700&family=Bangers&family=Black+Ops+One&family=Bungee&family=Creepster&family=Fredoka:wght@600&family=Mountains+of+Christmas:wght@700&family=Orbitron:wght@700&family=Playfair+Display:wght@500;600&family=Press+Start+2P&family=Rajdhani:wght@700&family=Russo+One&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: Arial, Helvetica, sans-serif;
        }

        #app { position: relative; width: 100%; height: 100%; }

        #counterBox { z-index: 20; text-align: center; }
        #artwork { display: none; }

        /* ============================================================
           DISEÑO CLÁSICO (morado) - por defecto
        ============================================================ */
        body.design-classic #counterBox {
            position: absolute;
            top: 30px;
            right: 30px;
            min-width: 240px;
            padding: 18px 30px 20px;
            border-radius: 20px;
            background: rgba(10, 10, 18, 0.90);
            border: 2px solid rgba(145, 71, 255, 0.90);
            box-shadow: 0 0 30px rgba(145, 71, 255, 0.30);
            color: white;
        }
        body.design-classic #stage { position: static; }
        body.design-classic #counterLabel {
            font-size: 15px; font-weight: 700; letter-spacing: 2px;
            color: #c9b3ff; margin-bottom: 4px;
        }
        body.design-classic #counter {
            font-size: 82px; line-height: .95; font-weight: 900; color: white;
            text-shadow: 0 0 18px rgba(145, 71, 255, 0.75);
        }
        body.design-classic #counterSub {
            margin-top: 8px; font-size: 11px; letter-spacing: 1.5px; color: #9ca3af;
        }
        body.design-classic .counterPulse { animation: pulseScale .35s ease; }

        @keyframes pulseScale {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* ============================================================
           DISEÑOS CON ARTE (floral / halloween)
           El "stage" mantiene SIEMPRE la proporción 871:286 de la imagen
           y se ajusta al tamaño de la fuente de OBS. Todo lo de adentro
           se posiciona en % y escala con --u (1% del ancho del stage),
           así no se descuadra sin importar el tamaño en OBS.
        ============================================================ */
        body:not(.design-classic) #counterBox {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body:not(.design-classic) #stage {
            position: relative;
            width: 100%;
            aspect-ratio: 871 / 286;
            max-height: 100%;
            flex: none;
        }

        body:not(.design-classic) #artwork {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #artwork svg { display: none; width: 100%; height: 100%; }
        #artwork img { display: none; width: 100%; height: 100%; }
        body.design-floral #artwork img { display: block; }
        body.design-halloween #artwork .art-halloween,
        body.design-christmas #artwork .art-christmas,
        body.design-birthday #artwork .art-birthday,
        body.design-cyber #artwork .art-cyber,
        body.design-space #artwork .art-space,
        body.design-ocean #artwork .art-ocean,
        body.design-arcade #artwork .art-arcade,
        body.design-beast #artwork .art-beast,
        body.design-storm #artwork .art-storm,
        body.design-aura #artwork .art-aura,
        body.design-slime #artwork .art-slime,
        body.design-kawaii #artwork .art-kawaii,
        body.design-ninja #artwork .art-ninja,
        body.design-mecha #artwork .art-mecha { display: block; }

        body:not(.design-classic) #counterLabel,
        body:not(.design-classic) #counter,
        body:not(.design-classic) #counterSub {
            position: absolute;
            left: var(--cx);
            transform: translate(-50%, -50%);
            margin: 0;
            width: 62%;
            text-align: center;
            white-space: nowrap;
            line-height: 1;
        }

        /* ---------- FLORAL PASTEL ---------- */
        body.design-floral {
            --cx: 50.7%;
            --ly: 27%;
            --ny: 52%;
            --sy: 76%;
        }
        body.design-floral #counterLabel {
            top: var(--ly);
            font-family: Georgia, "Times New Roman", serif;
            font-size: calc(var(--u, 1vw) * 3.3);
            font-weight: 500;
            letter-spacing: .14em;
            color: #59405d;
        }
        body.design-floral #counter {
            top: var(--ny);
            font-family: "Playfair Display", "Times New Roman", Times, serif;
            font-variant-numeric: lining-nums;
            font-size: calc(var(--u, 1vw) * 13.5);
            font-weight: 500;
            color: #302333;
            text-shadow: 0 1px 2px rgba(255, 255, 255, .75);
        }
        body.design-floral #counterSub {
            top: var(--sy);
            font-family: Georgia, "Times New Roman", serif;
            font-size: calc(var(--u, 1vw) * 2.3);
            font-weight: 500;
            letter-spacing: .10em;
            color: #59405d;
        }
        body.design-floral .counterPulse { animation: pulseBright .35s ease; }

        /* ---------- HALLOWEEN ---------- */
        body.design-halloween {
            --cx: 56%;
            --ly: 24%;
            --ny: 51%;
            --sy: 78%;
        }
        body.design-halloween #counterLabel {
            top: var(--ly);
            font-family: "Creepster", Impact, "Arial Black", sans-serif;
            font-size: calc(var(--u, 1vw) * 4.2);
            letter-spacing: .12em;
            color: #ff8a1f;
            text-shadow: 0 0 .5em rgba(255, 120, 0, .75), 0 2px 0 #3a1200;
        }
        body.design-halloween #counter {
            top: var(--ny);
            font-family: "Creepster", Impact, "Arial Black", sans-serif;
            font-size: calc(var(--u, 1vw) * 15);
            letter-spacing: .04em;
            color: #ffb347;
            text-shadow: 0 0 .22em rgba(255, 140, 0, .95), 0 0 .6em rgba(255, 90, 0, .55), 0 .04em 0 #5a1d00;
            animation: numFlicker 3.2s infinite;
        }
        body.design-halloween #counterSub {
            top: var(--sy);
            font-family: "Creepster", Impact, "Arial Black", sans-serif;
            font-size: calc(var(--u, 1vw) * 2.9);
            letter-spacing: .16em;
            color: #c9a4ea;
            text-shadow: 0 0 .5em rgba(160, 90, 255, .7);
        }
        body.design-halloween .counterPulse { animation: pulseBright .35s ease; }

        /* Números largos: reducir para que nunca se salgan del marco */
        body:not(.design-classic) #counter[data-len="5"] { font-size: calc(var(--u, 1vw) * 11); }
        body:not(.design-classic) #counter[data-len="6"],
        body:not(.design-classic) #counter[data-len="7"] { font-size: calc(var(--u, 1vw) * 8.5); }


        /* ---------- NAVIDAD ---------- */
        body.design-christmas {
            --cx: 53%;
            --ly: 27%;
            --ny: 52%;
            --sy: 78%;
        }
        body.design-christmas #counterLabel {
            top: var(--ly);
            font-family: "Mountains of Christmas", Georgia, "Times New Roman", serif;
            font-weight: 700;
            font-size: calc(var(--u, 1vw) * 4.2);
            letter-spacing: .1em;
            color: #f7dd8a;
            text-shadow: 0 0 .45em rgba(255, 200, 80, .6), 0 .06em 0 #5a0d0d;
        }
        body.design-christmas #counter {
            top: var(--ny);
            font-family: "Mountains of Christmas", Georgia, "Times New Roman", serif;
            font-weight: 700;
            font-size: calc(var(--u, 1vw) * 14);
            color: #ffffff;
            text-shadow: 0 0 .2em rgba(255, 215, 120, .9), 0 0 .55em rgba(255, 170, 60, .45), 0 .05em 0 #9b1c1c;
        }
        body.design-christmas #counterSub {
            top: var(--sy);
            font-family: "Mountains of Christmas", Georgia, "Times New Roman", serif;
            font-weight: 700;
            font-size: calc(var(--u, 1vw) * 2.9);
            letter-spacing: .14em;
            color: #ffb8b8;
            text-shadow: 0 0 .4em rgba(255, 90, 90, .55);
        }
        body.design-christmas .counterPulse { animation: pulseBright .35s ease; }

        /* ---------- CUMPLEAÑOS ---------- */
        body.design-birthday {
            --cx: 53%;
            --ly: 27%;
            --ny: 52%;
            --sy: 78%;
        }
        body.design-birthday #counterLabel {
            top: var(--ly);
            font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
            font-weight: 600;
            font-size: calc(var(--u, 1vw) * 3.5);
            letter-spacing: .16em;
            color: #8a2fb0;
            text-shadow: 0 .05em 0 rgba(255, 255, 255, .9);
        }
        body.design-birthday #counter {
            top: var(--ny);
            font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
            font-weight: 600;
            font-size: calc(var(--u, 1vw) * 14);
            color: #e8287a;
            text-shadow: 0 .04em 0 #ffffff, 0 0 .18em rgba(255, 255, 255, .95), 0 .09em 0 rgba(150, 20, 90, .35);
        }
        body.design-birthday #counterSub {
            top: var(--sy);
            font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
            font-weight: 600;
            font-size: calc(var(--u, 1vw) * 2.5);
            letter-spacing: .16em;
            color: #6c4bc4;
            text-shadow: 0 .05em 0 rgba(255, 255, 255, .9);
        }
        body.design-birthday .counterPulse { animation: pulseBright .35s ease; }

        /* Animaciones SVG navidad / cumpleaños */
        .xm-twinkle { animation: xmTwinkle 1.8s ease-in-out infinite; }
        @keyframes xmTwinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: .35; }
        }
        .xm-snow { animation: xmFall 5s linear infinite; }
        @keyframes xmFall {
            0% { transform: translateY(0); opacity: 0; }
            15% { opacity: .95; }
            85% { opacity: .95; }
            100% { transform: translateY(70px); opacity: 0; }
        }
        .bd-float { animation: bdFloat 3.2s ease-in-out infinite; }
        .bd-float.f2 { animation-duration: 2.6s; animation-delay: -.9s; }
        .bd-float.f3 { animation-duration: 3.8s; animation-delay: -1.7s; }
        @keyframes bdFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .bd-flame {
            transform-box: fill-box;
            transform-origin: 50% 100%;
            animation: bdFlame .5s ease-in-out infinite alternate;
        }
        .bd-flame.f2 { animation-duration: .42s; }
        .bd-flame.f3 { animation-duration: .58s; }
        @keyframes bdFlame {
            0% { transform: scale(1, 1); }
            100% { transform: scale(.88, 1.16); }
        }


        /* ---------- CYBER ---------- */
        body.design-cyber {
            --cx: 52%;
            --ly: 27%;
            --ny: 52%;
            --sy: 78%;
        }
        body.design-cyber #counterLabel {
            top: var(--ly);
            font-family: "Orbitron", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 3.1);
            letter-spacing: .2em;
            color: #5ef2ff;
            text-shadow: 0 0 .5em rgba(0,240,255,.85);
        }
        body.design-cyber #counter {
            top: var(--ny);
            font-family: "Orbitron", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 12);
            letter-spacing: .02em;
            color: #ffffff;
            text-shadow: -.03em 0 #ff2bd6, .03em 0 #00f0ff, 0 0 .4em rgba(255,43,214,.75);
        }
        body.design-cyber #counterSub {
            top: var(--sy);
            font-family: "Orbitron", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 2.2);
            letter-spacing: .24em;
            color: #ff6ee0;
            text-shadow: 0 0 .6em rgba(255,43,214,.9);
        }

        /* ---------- SPACE ---------- */
        body.design-space {
            --cx: 55%;
            --ly: 27%;
            --ny: 52%;
            --sy: 78%;
        }
        body.design-space #counterLabel {
            top: var(--ly);
            font-family: "Audiowide", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 3.4);
            letter-spacing: .2em;
            color: #9fd4ff;
            text-shadow: 0 0 .5em rgba(110,170,255,.8);
        }
        body.design-space #counter {
            top: var(--ny);
            font-family: "Audiowide", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 13);
            letter-spacing: .02em;
            color: #ffffff;
            text-shadow: 0 0 .25em rgba(150,200,255,.95), 0 0 .7em rgba(110,90,255,.6);
        }
        body.design-space #counterSub {
            top: var(--sy);
            font-family: "Audiowide", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 2.4);
            letter-spacing: .2em;
            color: #c9b0ff;
            text-shadow: 0 0 .5em rgba(150,110,255,.8);
        }

        /* ---------- OCEAN ---------- */
        body.design-ocean {
            --cx: 53%;
            --ly: 27%;
            --ny: 52%;
            --sy: 78%;
        }
        body.design-ocean #counterLabel {
            top: var(--ly);
            font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
            font-size: calc(var(--u, 1vw) * 3.4);
            letter-spacing: .16em;
            color: #e6fcff;
            text-shadow: 0 .06em 0 rgba(0,60,110,.55);
        }
        body.design-ocean #counter {
            top: var(--ny);
            font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
            font-size: calc(var(--u, 1vw) * 14);
            letter-spacing: 0;
            color: #ffffff;
            text-shadow: 0 .05em 0 rgba(0,70,130,.6), 0 0 .3em rgba(180,250,255,.75);
        }
        body.design-ocean #counterSub {
            top: var(--sy);
            font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
            font-size: calc(var(--u, 1vw) * 2.5);
            letter-spacing: .16em;
            color: #c8f3ff;
            text-shadow: 0 .06em 0 rgba(0,60,110,.55);
        }

        /* ---------- ARCADE ---------- */
        body.design-arcade {
            --cx: 53%;
            --ly: 27%;
            --ny: 52%;
            --sy: 78%;
        }
        body.design-arcade #counterLabel {
            top: var(--ly);
            font-family: "Press Start 2P", "Courier New", monospace;
            font-size: calc(var(--u, 1vw) * 2.3);
            letter-spacing: .1em;
            color: #00e5ff;
            text-shadow: .08em .08em 0 #ff3df0;
        }
        body.design-arcade #counter {
            top: var(--ny);
            font-family: "Press Start 2P", "Courier New", monospace;
            font-size: calc(var(--u, 1vw) * 8.5);
            letter-spacing: 0;
            color: #ffe600;
            text-shadow: .07em .07em 0 #ff3d3d;
        }
        body.design-arcade #counterSub {
            top: var(--sy);
            font-family: "Press Start 2P", "Courier New", monospace;
            font-size: calc(var(--u, 1vw) * 1.8);
            letter-spacing: .1em;
            color: #ff7af5;
            text-shadow: .1em .1em 0 #000;
        }
        body.design-arcade #counter[data-len="5"] { font-size: calc(var(--u, 1vw) * 6.8); }
        body.design-arcade #counter[data-len="6"],
        body.design-arcade #counter[data-len="7"] { font-size: calc(var(--u, 1vw) * 5.4); }

        /* ---------- BEAST ---------- */
        body.design-beast {
            --cx: 55%;
            --ly: 27%;
            --ny: 52%;
            --sy: 78%;
        }
        body.design-beast #counterLabel {
            top: var(--ly);
            font-family: "Bangers", Impact, "Arial Black", sans-serif;
            font-size: calc(var(--u, 1vw) * 4.4);
            letter-spacing: .1em;
            color: #ffd166;
            text-shadow: .05em .05em 0 #7a1200, 0 0 .4em rgba(255,120,0,.65);
        }
        body.design-beast #counter {
            top: var(--ny);
            font-family: "Bangers", Impact, "Arial Black", sans-serif;
            font-size: calc(var(--u, 1vw) * 16);
            letter-spacing: .02em;
            color: #ffffff;
            text-shadow: 0 0 .15em #ffb347, 0 0 .5em rgba(255,90,0,.9), .04em .05em 0 #b32000;
        }
        body.design-beast #counterSub {
            top: var(--sy);
            font-family: "Bangers", Impact, "Arial Black", sans-serif;
            font-size: calc(var(--u, 1vw) * 3);
            letter-spacing: .12em;
            color: #ff8a4d;
            text-shadow: .06em .06em 0 #3a0a00, 0 0 .4em rgba(255,100,0,.6);
        }

        body.design-cyber .counterPulse,
        body.design-space .counterPulse,
        body.design-ocean .counterPulse,
        body.design-arcade .counterPulse,
        body.design-beast .counterPulse { animation: pulseBright .35s ease; }

        /* Animaciones SVG nuevos diseños */
        .oc-bubble { animation: ocBubble 4.5s ease-in infinite; }
        @keyframes ocBubble {
            0% { transform: translateY(0); opacity: 0; }
            15% { opacity: .9; }
            100% { transform: translateY(-80px); opacity: 0; }
        }
        .oc-sway {
            transform-box: fill-box;
            transform-origin: 50% 100%;
            animation: ocSway 3.2s ease-in-out infinite alternate;
        }
        @keyframes ocSway {
            from { transform: rotate(-4deg); }
            to { transform: rotate(4deg); }
        }
        .ar-blink { animation: arBlink 1.2s linear infinite; }
        @keyframes arBlink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }


        /* ---------- STORM ---------- */
        body.design-storm { --cx: 55%; --ly: 27%; --ny: 52%; --sy: 78%; }
        body.design-storm #counterLabel {
            top: var(--ly);
            font-family: "Bungee", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 3.1);
            letter-spacing: .1em;
            color: #ffe566;
            text-shadow: 0 0 .5em rgba(255,212,0,.6);
        }
        body.design-storm #counter {
            top: var(--ny);
            font-family: "Bungee", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 11.5);
            letter-spacing: .02em;
            color: #ffffff;
            text-shadow: 0 0 .2em #ffd400, 0 0 .6em rgba(255,212,0,.6), .04em .05em 0 #7a5a00;
        }
        body.design-storm #counterSub {
            top: var(--sy);
            font-family: "Bungee", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 2.3);
            letter-spacing: .16em;
            color: #ffd400;
            text-shadow: 0 0 .5em rgba(255,212,0,.6);
        }

        /* ---------- AURA ---------- */
        body.design-aura { --cx: 56%; --ly: 27%; --ny: 52%; --sy: 78%; }
        body.design-aura #counterLabel {
            top: var(--ly);
            font-family: "Russo One", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 3.6);
            letter-spacing: .1em;
            color: #ffd36b;
            text-shadow: 0 0 .5em rgba(255,150,0,.7);
        }
        body.design-aura #counter {
            top: var(--ny);
            font-family: "Russo One", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 13);
            letter-spacing: .02em;
            color: #ffffff;
            text-shadow: 0 0 .25em #ffcf4a, 0 0 .7em rgba(255,120,0,.8), .04em .05em 0 #b34a00;
        }
        body.design-aura #counterSub {
            top: var(--sy);
            font-family: "Russo One", "Arial Black", Impact, sans-serif;
            font-size: calc(var(--u, 1vw) * 2.6);
            letter-spacing: .14em;
            color: #ff9d4a;
            text-shadow: 0 0 .5em rgba(255,100,0,.7);
        }

        /* ---------- SLIME ---------- */
        body.design-slime { --cx: 54%; --ly: 27%; --ny: 52%; --sy: 78%; }
        body.design-slime #counterLabel {
            top: var(--ly);
            font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
            font-size: calc(var(--u, 1vw) * 3.4);
            letter-spacing: .14em;
            color: #d4ffb8;
            text-shadow: 0 .06em 0 #0f5a2a;
        }
        body.design-slime #counter {
            top: var(--ny);
            font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
            font-size: calc(var(--u, 1vw) * 14);
            letter-spacing: 0;
            color: #ffffff;
            text-shadow: 0 .05em 0 #0f7a3a, 0 0 .3em rgba(160,255,120,.85);
        }
        body.design-slime #counterSub {
            top: var(--sy);
            font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
            font-size: calc(var(--u, 1vw) * 2.5);
            letter-spacing: .16em;
            color: #8bffc0;
            text-shadow: 0 .06em 0 #0f5a2a;
        }

        /* ---------- KAWAII ---------- */
        body.design-kawaii { --cx: 54%; --ly: 27%; --ny: 52%; --sy: 78%; }
        body.design-kawaii #counterLabel {
            top: var(--ly);
            font-family: "Baloo 2", "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
            font-size: calc(var(--u, 1vw) * 3.6);
            letter-spacing: .12em;
            color: #d85a93;
            text-shadow: 0 .05em 0 rgba(255,255,255,.95);
        }
        body.design-kawaii #counter {
            top: var(--ny);
            font-family: "Baloo 2", "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
            font-size: calc(var(--u, 1vw) * 14.5);
            letter-spacing: 0;
            color: #ff5c9c;
            text-shadow: 0 .04em 0 #fff, 0 0 .2em #fff, 0 .09em 0 rgba(180,40,110,.35);

        body.design-storm .counterPulse,

        body.design-kawaii .counterPulse,
        body.design-ninja .counterPulse,

        /* Animaciones SVG (storm / aura / slime / ninja / mecha) */
        .au-pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: auPulse 1.6s ease-in-out infinite alternate; }
        @keyframes auPulse { from { transform: scale(1); opacity: .85; } to { transform: scale(1.08); opacity: 1; } }
        .au-spin { transform-box: fill-box; transform-origin: 50% 50%; animation: niSpin 24s linear infinite; }
        .sl-wobble { transform-box: fill-box; transform-origin: 50% 100%; animation: slWobble 1.8s ease-in-out infinite alternate; }
        .sl-wobble.w2 { animation-duration: 1.4s; animation-delay: -.5s; }
        .sl-wobble.w3 { animation-duration: 2.1s; animation-delay: -1s; }
        @keyframes slWobble { from { transform: scale(1.05, .94); } to { transform: scale(.96, 1.06); } }
        .ni-spin { transform-box: fill-box; transform-origin: 50% 50%; animation: niSpin 3s linear infinite; }
        @keyframes niSpin { to { transform: rotate(360deg); } }
        .ni-flap { transform-box: fill-box; transform-origin: 0% 50%; animation: niFlap 1.2s ease-in-out infinite alternate; }
        @keyframes niFlap { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
        .me-rot { transform-box: fill-box; transform-origin: 50% 50%; animation: niSpin 9s linear infinite; }
        .me-rot.r2 { animation-duration: 6s; animation-direction: reverse; }
        .me-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: meBar 1s ease-in-out infinite alternate; }
        @keyframes meBar { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
        .me-scan { animation: meScan 3.4s linear infinite; }
        @keyframes meScan { from { transform: translateY(0); opacity: 0; } 10% { opacity: .5; } 90% { opacity: .5; } to { transform: translateY(230px); opacity: 0; } }

        @keyframes pulseBright {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.25); }
            100% { filter: brightness(1); }
        }

        @keyframes numFlicker {
            0%, 100% { opacity: 1; }
            46% { opacity: 1; }
            48% { opacity: .82; }
            50% { opacity: 1; }
            72% { opacity: .92; }
            74% { opacity: 1; }
        }

        /* Animaciones del SVG de Halloween */
        .hw-flicker { animation: hwFlicker 2.6s infinite; }
        @keyframes hwFlicker {
            0%, 100% { opacity: 1; }
            20% { opacity: .9; }
            22% { opacity: .65; }
            24% { opacity: 1; }
            60% { opacity: .95; }
            63% { opacity: .75; }
            66% { opacity: 1; }
        }
        .hw-spider { transform-origin: 745px 22px; animation: hwSway 3.4s ease-in-out infinite; }
        @keyframes hwSway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        .hw-bat { animation: hwFloat 3s ease-in-out infinite; }
        .hw-bat.b2 { animation-duration: 2.4s; animation-delay: -.8s; }
        .hw-bat.b3 { animation-duration: 3.6s; animation-delay: -1.6s; }
        @keyframes hwFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .hw-ember { animation: hwEmber 3s ease-in-out infinite; }
        @keyframes hwEmber {
            0%, 100% { opacity: .15; }
            50% { opacity: .9; }
        }
    </style>
</head>

    <script>
        /* SESI\u{D3}N ESTABLE PARA P\u{C1}GINAS DE OBS */
        (function () {
            const params = new URLSearchParams(window.location.search);
            let sessionId = params.get("session") || localStorage.getItem("squat_session_id") || "";
            window.SQUAT_SESSION_ID = sessionId;
            const nativeFetch = window.fetch.bind(window);
            function addSession(url) {
                const absolute = new URL(url, window.location.origin);
                if (absolute.origin !== window.location.origin) return url;
                if (absolute.pathname.startsWith("/api/") && window.SQUAT_SESSION_ID) absolute.searchParams.set("session", window.SQUAT_SESSION_ID);
                return absolute.pathname + absolute.search + absolute.hash;
            }
            window.SQUAT_SESSION_READY = (async () => {
                const endpoint = sessionId ? `/api/session?session=${encodeURIComponent(sessionId)}` : "/api/session";
                const response = await nativeFetch(endpoint, { credentials: "same-origin" });
                const data = await response.json();
                if (!response.ok || !data.ok || !data.sessionId) throw new Error("No se pudo recuperar la sesi\u{F3}n.");
                window.SQUAT_SESSION_ID = data.sessionId;
                localStorage.setItem("squat_session_id", data.sessionId);
                return data;
            })();
            window.fetch = async function (input, init) {
                await window.SQUAT_SESSION_READY;
                if (typeof input === "string") input = addSession(input);
                else if (input instanceof Request) input = new Request(addSession(input.url), input);
                return nativeFetch(input, init);
            };
        })();
    </script>

    <script>
        /* ============================================================
           ELEMENTOS
        ============================================================ */
        const counterElement = document.getElementById("counter");
        const counterBox = document.getElementById("counterBox");
        const stage = document.getElementById("stage");

        let counter = 0;
        let socket = null;

        /* ============================================================
           AJUSTE DEL ESCENARIO (floral / halloween)
           Mantiene la proporci\u{F3}n 871:286 sin importar el tama\u{F1}o de OBS
        ============================================================ */
        const STAGE_RATIO = 871 / 286;

        function fitStage() {
            if (window.SQUAT_DESIGN === "classic") return;

            const W = window.innerWidth;
            const H = window.innerHeight;

            let w = W;
            let h = W / STAGE_RATIO;

            if (h > H) {
                h = H;
                w = H * STAGE_RATIO;
            }

            stage.style.width = w + "px";
            stage.style.height = h + "px";
            stage.style.setProperty("--u", (w / 100) + "px");
        }

        window.addEventListener("resize", fitStage);
        fitStage();

        /* ============================================================
           ACTUALIZAR CONTADOR
        ============================================================ */
        function updateCounter(value) {
            const newValue = Math.max(0, Math.floor(Number(value) || 0));

            counterElement.dataset.len = String(newValue).length;

            if (newValue !== counter) {
                counter = newValue;
                counterElement.textContent = counter;

                counterBox.classList.remove("counterPulse");
                void counterBox.offsetWidth;
                counterBox.classList.add("counterPulse");
            } else {
                counterElement.textContent = counter;
            }
        }

        /* ============================================================
           CARGAR CONTADOR
        ============================================================ */
        async function loadCounter() {
            try {
                const response = await fetch("/api/squats", { cache: "no-store" });
                if (!response.ok) throw new Error("No se pudo obtener el contador");
                const data = await response.json();
                updateCounter(data.pendingSquats);
            } catch (error) {
                console.error("Error cargando contador:", error);
            }
        }

        /* ============================================================
           WEBSOCKET
        ============================================================ */
        function connectWebSocket() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

            const protocol = location.protocol === "https:" ? "wss:" : "ws:";

            socket = new WebSocket(`${protocol}//${location.host}/ws?session=${encodeURIComponent(window.SQUAT_SESSION_ID || "")}`);

            socket.addEventListener("open", () => console.log("\u{1F7E2} Contador conectado"));

            socket.addEventListener("message", event => {
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === "counter:update") {
                        updateCounter(message.data?.pendingSquats);
                    }
                } catch (error) {
                    console.error("Error leyendo WebSocket:", error);
                }
            });

            socket.addEventListener("close", () => {
                console.log("\u{1F534} WebSocket desconectado");
                setTimeout(connectWebSocket, 2000);
            });

            socket.addEventListener("error", error => console.error("Error WebSocket:", error));
        }

        /* ============================================================
           INICIO
        ============================================================ */
        loadCounter();
        connectWebSocket();
    </script>
